# Package metadata only. The supported install paths are install.sh and the
# postmarketOS packages; OPOS uses the Python standard library alone.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opos"
version = "0.1.0"
description = "Experimental Surface Duo 1 web interface with simulated battery-rule tasks, calls and texts"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Louis Calata" }]
dependencies = []
classifiers = ["Programming Language :: Python :: 3"]

[project.urls]
Source = "https://github.com/louiscalata/old-phone-os"

# The pages, the alarm tone and the fonts are read from these files at run time (tests/test_package_data.py).
[tool.setuptools.package-data]
opos = ["web_static/*", "web_static/fonts/*", "public_static/*", "panes_static/*", "osk_static/*", "apps_static/*",
        "sounds/*"]
