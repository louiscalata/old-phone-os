# SPDX-License-Identifier: GPL-3.0-or-later
# Package metadata only. The supported install paths are install.sh and the
# postmarketOS packages; OPOS uses the Python standard library alone.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opos"
version = "0.1.0"
description = "Experimental Surface Duo 1 web interface with simulated battery-rule tasks, calls and texts"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Louis Calata" }]
dependencies = []
classifiers = ["Programming Language :: Python :: 3"]

[project.urls]
Source = "https://github.com/louiscalata/old-phone-os"

# The pages, the alarm tone and the fonts are read from these files at run time (tests/test_package_data.py).
[tool.setuptools.package-data]
opos = ["web_static/*", "web_static/fonts/*", "public_static/*", "panes_static/*", "osk_static/*", "apps_static/*",
        "sounds/*"]

# Ruff 0.17.4; see docs/python-style.md. Formatting only, no lint autofixes.
[tool.ruff]
line-length = 120
target-version = "py311"
include = ["*.py", "*.pyi"]
extend-include = ["packaging/duo-os/opos-selftest", "packaging/duo-os/updater/opos-updater"]
# Export paths may be ignored by the containing workspace; only explicit scopes are checked.
respect-gitignore = false
force-exclude = true

[tool.ruff.format]
# Linted (LOU-84) but kept out of the formatter: each file below keeps exact source bytes or literals that a test or a
# package pin asserts. TODO(LOU-84): reformat each one in its own reviewed pull request together with its test.
exclude = [
    # APKBUILD SHA-512 pin; regenerate only in a packaging review.
    "packaging/pmos/opos/opos-systemd-state.py",
    # test_selftest.py asserts a single-line argparse source expression.
    "packaging/duo-os/opos-selftest",
    # test_update_recovery_wording.py requires single-quoted message source literals.
    "packaging/duo-os/updater/opos-updater",
    # test_native_shell.py asserts exact source lines and bounded source windows.
    "src/opos/native/shell.py",
    # test_ckpt2_security.py parses its single-line assertEqual source expression.
    "tests/test_duo_dev_sudo.py",
    # its unconditional decoy-rule guard reads and matches its own assertion as one source line.
    "tests/test_20-firewall_review.py",
]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "N", "C90", "RUF100", "S"]
# Preserve the existing ci/security.sh policy: assertions, explicit subprocesses,
# PATH-resolved tools, non-cryptographic randomness, and intentional continue handlers.
ignore = ["S101", "S603", "S607", "S311", "S112"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Exact existing file/code pairs after formatting all three scopes. This is not a count ratchet:
