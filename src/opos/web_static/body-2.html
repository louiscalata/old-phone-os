<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
<div id="sheet-handle"></div>
<h1 id="sheet-title" data-tone="normal" tabindex="-1">--%</h1>
<div id="time-left"></div>
<p id="lean-line">Memory figures unavailable on this device</p>
<div id="headline"></div>
<div id="goal-note"></div>
<div id="goal-row"><label>Last until <input type="time" id="goal"></label><button id="goal-clear">Clear</button></div>
<div id="paused-list"></div>
<svg id="history" viewBox="0 0 100 60" preserveAspectRatio="none" role="img" aria-label="Battery level, last hour"><polyline fill="none" stroke="var(--jaryo-fg)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>
<div id="history-label">last hour</div>
<details id="shade-technical"><summary>Technical details</summary><div id="features"></div><div id="why"></div></details>
