# Installed as sensorfwd.service.d/70-opos-boot.conf, a drop-in for the port's own sensorfwd.service (whose unit file is not
# changed: deleting this file is the rollback). `touch /etc/opos/sensors-off` makes systemd skip future starts, with no failure
# and no restart; it does not stop a running sensorfwd (for a live stop also run `systemctl disable --now
# opos-sensorfwd-delayed.timer` and `systemctl stop sensorfwd`). A sensorfwd that keeps failing is started at most 3 times
# in 5 minutes and then left down. sensorfwd is not enabled; opos-sensorfwd-delayed.timer starts it 120 s after boot. See packaging/duo-os/README.md, "What is in the image".
[Unit]
ConditionPathExists=!/etc/opos/sensors-off
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
Restart=on-failure
