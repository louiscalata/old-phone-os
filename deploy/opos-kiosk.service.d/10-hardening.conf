[Service]
# No MemoryDenyWriteExecute: browser JIT needs it; user-unit sandboxing needs user namespaces, so run "systemd-analyze --user verify" and "systemctl --user status opos-kiosk" after installing, and remove only the failing directive if the unit fails with status 218 or 226.
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=%h/.local/state/opos
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
SystemCallArchitectures=native
UMask=0077
TasksMax=512
MemoryMax=768M
