name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - name: Install and verify test dependencies
        run: |
          # The runner image ships Chrome; install it only if a future image drops it.
          command -v google-chrome >/dev/null || { sudo apt-get update && sudo apt-get install --yes google-chrome-stable; }
          # Match the lint version used locally; verify the upstream release archive.
          curl --fail --location --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "OPOS_TEST_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          node --version
          node -e 'if (typeof WebSocket !== "function") process.exit(1)'
          google-chrome --version
          shellcheck --version
          shellcheck deploy/make-manifest.sh deploy/verify-manifest.sh
      - name: Run the test suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -t .

  easy-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ShellCheck 0.11.0
        run: |
          curl --fail --location --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: ShellCheck easy-setup scripts
        run: shellcheck packaging/pmos/easy/*.sh packaging/pmos/qemu-smoke.sh
      - name: Prove plan mode makes no changes
        run: PYTHONPATH=src python3 -m unittest tests.test_pmos_easy_install_dry_run tests.test_pmos_easy_install tests.test_pmos_confirm_reboot tests.test_pmos_image_prep tests.test_pmos_easy_docs tests.test_pmos_qemu_smoke.TestQemuSmokePlan

  qemu-guest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a guest kernel and QEMU
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes qemu-system-x86 busybox-static cpio linux-image-generic
      - name: Boot a tiny guest
        run: |
          kernel=$(ls -1 /boot/vmlinuz-* | tail -n 1)
          sudo cp "$kernel" "$RUNNER_TEMP/vmlinuz"
          sudo chmod 644 "$RUNNER_TEMP/vmlinuz"
          OPOS_QEMU_KERNEL="$RUNNER_TEMP/vmlinuz" sh packaging/pmos/qemu-smoke.sh --guest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-guest-smoke-log
          path: qemu-guest-smoke.log
          if-no-files-found: error
