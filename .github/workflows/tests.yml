name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "box-linux"]' || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - name: Install and verify test dependencies
        run: |
          # The runner image ships Chrome; install it only if a future image drops it.
          command -v google-chrome >/dev/null || { sudo apt-get update && sudo apt-get install --yes google-chrome-stable; }
          # Match the lint version used locally; verify the upstream release archive.
          curl --fail --location --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          # Keep headless CI browsers off the runner's keychain and password store.
          # printf avoids a YAML-indented heredoc breaking the shebang.
          printf '%s\n' '#!/bin/sh' 'exec google-chrome --use-mock-keychain --password-store=basic "$@"' > "$RUNNER_TEMP/opos-chrome"
          chmod 0755 "$RUNNER_TEMP/opos-chrome"
          echo "CHROME=$RUNNER_TEMP/opos-chrome" >> "$GITHUB_ENV"
          echo "OPOS_TEST_CHROME=$RUNNER_TEMP/opos-chrome" >> "$GITHUB_ENV"
          node --version
          node -e 'if (typeof WebSocket !== "function") process.exit(1)'
          google-chrome --version
          shellcheck --version
          shellcheck deploy/make-manifest.sh deploy/verify-manifest.sh
      - name: Run the test suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -t .
